name: Build G57 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -e
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $ANDROID_SDK_ROOT/cmdline-tools"
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "Using sdkmanager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK integrity, package metadata, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"

          test -s "$APK"
          echo "APK size:"
          stat -c '%s bytes' "$APK"

          echo "Checking ZIP/APK structure..."
          unzip -t "$APK"

          echo "Checking APK signature..."
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "Checking package name and version..."
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.g57.issuehub' versionCode='9' versionName='0.2.8'" apk-badging.txt

          sha256sum "$APK" | tee app-debug.apk.sha256
          {
            echo "### Verified G57 APK"
            echo ""
            echo "- Package: `com.g57.issuehub`"
            echo "- Version: `0.2.8 (9)`"
            echo "- APK size: $(stat -c '%s bytes' "$APK")"
            echo "- SHA-256: `$(sha256sum "$APK" | cut -d ' ' -f 1)`"
            echo "- ZIP structure: passed"
            echo "- APK signature: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: G57-v0.2.8-issue-management
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            apk-badging.txt
          if-no-files-found: error
          compression-level: 0

      - name: Publish G57 v0.2.8 GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Prepare G57 0.2.8 release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.8
          name: G57 v0.2.8
          target_commitish: main
          body: |
            G57 0.2.8 Android APK.

            This is a debug-signed APK built by GitHub Actions. Verify the SHA-256 checksum before installing.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          overwrite_files: true
          make_latest: true
