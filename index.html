<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G57 Admin — User Passwords</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:#0b1020; color:#edf2ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; }
    main { width:min(100%,560px); background:#141b2e; border:1px solid #2b3653; border-radius:18px; padding:24px; box-shadow:0 18px 60px #0005; }
    h1 { margin:0 0 6px; font-size:1.65rem; } p { color:#aebbd6; line-height:1.5; }
    label { display:block; font-size:.92rem; margin:16px 0 7px; color:#d8e2fa; }
    input,select,button { width:100%; border-radius:10px; border:1px solid #354362; padding:12px; font:inherit; }
    input,select { background:#0c1325; color:#fff; }
    button { margin-top:16px; cursor:pointer; border:0; background:#8bb5ff; color:#071326; font-weight:700; }
    button.secondary { background:#273550; color:#edf2ff; }
    button:disabled { opacity:.55; cursor:wait; }
    .hidden { display:none; } .note { font-size:.82rem; } #status { margin-top:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .warning { border-left:3px solid #f3bd63; padding-left:12px; }
  </style>
</head>
<body>
<main>
  <h1>G57 Admin</h1>
  <p>Admin-only tool to change a G57 user's password.</p>
  <p class="warning note">Never enter or store a service-role/secret key here. Use only the project's public publishable (or legacy anon) key.</p>

  <section id="config">
    <label for="publicKey">Supabase publishable key (public key)</label>
    <input id="publicKey" autocomplete="off" placeholder="sb_publishable_… or legacy anon key">
    <label for="email">Admin email</label>
    <input id="email" type="email" autocomplete="username" value="noysz@g57.app">
    <label for="password">Admin password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
  </section>

  <section id="manager" class="hidden">
    <p>Signed in as <strong id="who"></strong></p>
    <label for="users">Choose user</label>
    <select id="users"><option value="">Loading users…</option></select>
    <label for="newPassword">New password (8–128 characters)</label>
    <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128">
    <button id="changeBtn">Change password</button>
    <button id="refreshBtn" class="secondary">Refresh user list</button>
    <button id="logoutBtn" class="secondary">Sign out</button>
  </section>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://suxefkusikcqnkvaudsq.supabase.co';
  const OWNER_UID = '8889b1a6-7dbd-4d42-9dcc-b231ddd0c5f2';
  const $ = (id) => document.getElementById(id);
  let client = null;
  let session = null;

  function status(message, isError = false) {
    $('status').textContent = message;
    $('status').style.color = isError ? '#ff9e9e' : '#9fe0b0';
  }
  async function callAdminFunction(payload) {
    if (!session) throw new Error('Please sign in again.');
    const response = await fetch(SUPABASE_URL + '/functions/v1/admin-set-password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token,
        'apikey': $('publicKey').value.trim()
      },
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'Request failed (' + response.status + ')');
    return data;
  }
  async function loadUsers() {
    $('users').replaceChildren(new Option('Loading users…', ''));
    try {
      const data = await callAdminFunction({ action: 'listUsers' });
      if (!Array.isArray(data.users)) throw new Error(data.error || 'The function did not return a user list. Update and redeploy admin-set-password first.');
      $('users').replaceChildren();
      for (const user of data.users) {
        const label = (user.email || user.id) + ' — ' + user.id;
        $('users').add(new Option(label, user.id));
      }
      if (!data.users.length) $('users').add(new Option('No users found', ''));
      status('Loaded ' + data.users.length + ' user(s).');
    } catch (error) {
      $('users').replaceChildren(new Option('Could not load users', ''));
      status(error.message, true);
    }
  }
  $('loginBtn').addEventListener('click', async () => {
    const key = $('publicKey').value.trim();
    const email = $('email').value.trim();
    const password = $('password').value;
    if (!key || !email || !password) return status('Enter the public key, admin email, and admin password.', true);
    $('loginBtn').disabled = true;
    try {
      client = createClient(SUPABASE_URL, key, { auth: { persistSession: false, autoRefreshToken: true } });
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) throw error;
      session = data.session;
      if (data.user.id !== OWNER_UID) {
        await client.auth.signOut();
        session = null;
        throw new Error('This account is not the G57 owner account.');
      }
      $('config').classList.add('hidden');
      $('manager').classList.remove('hidden');
      $('who').textContent = data.user.email || data.user.id;
      status('Signed in. Checking admin permissions…');
      await loadUsers();
    } catch (error) {
      status(error.message || 'Sign-in failed.', true);
    } finally {
      $('loginBtn').disabled = false;
    }
  });
  $('changeBtn').addEventListener('click', async () => {
    const userId = $('users').value;
    const newPassword = $('newPassword').value;
    if (!userId) return status('Choose a user first.', true);
    if (newPassword.length < 8 || newPassword.length > 128) return status('Password must be 8–128 characters.', true);
    if (!confirm('Change the password for the selected user? They will need the new password to sign in.')) return;
    $('changeBtn').disabled = true;
    try {
      await callAdminFunction({ action: 'setPassword', userId, newPassword });
      $('newPassword').value = '';
      status('Password changed successfully.');
    } catch (error) {
      status(error.message, true);
    } finally {
      $('changeBtn').disabled = false;
    }
  });
  $('refreshBtn').addEventListener('click', loadUsers);
  $('logoutBtn').addEventListener('click', async () => {
    if (client) await client.auth.signOut();
    session = null; client = null;
    $('manager').classList.add('hidden');
    $('config').classList.remove('hidden');
    $('password').value = '';
    $('newPassword').value = '';
    status('Signed out.');
  });
</script>
</body>
</html>
