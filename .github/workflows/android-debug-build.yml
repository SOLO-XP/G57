name: GMailGPU Android Debug Build

on:
  push:
    branches:
      - feature/issue-chat-01-beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only token: this workflow only builds and uploads an artifact.
permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # Discover the runner-provided Android SDK tools explicitly; sdkmanager
      # is not guaranteed to be on PATH in GitHub-hosted runner images.
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -d "$ANDROID_HOME" ]]; then
            echo "::error::Android SDK directory not found: $ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "Using SDK manager at: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          # sdkmanager closes the pipe after consuming its prompts; with pipefail
          # enabled, 'yes' receiving SIGPIPE can incorrectly fail this step.
          set +e
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$sdk_status" -ne 0 ]]; then
            echo "::error::sdkmanager --licenses failed with exit code $sdk_status"
            exit "$sdk_status"
          fi

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GMailGPU-0.1-Beta-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
