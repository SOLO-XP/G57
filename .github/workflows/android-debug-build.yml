name: GMailGPU Android Debug Build

on:
  push:
    branches:
      - feature/issue-chat-01-beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only token: this workflow only builds and uploads an artifact.
permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners include Android command-line tools.
      # Accept SDK licenses non-interactively before installing only the required packages.
      - name: Accept Android SDK licenses
        shell: bash {0}
        run: |
          set +e
          yes | sdkmanager --licenses >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -e
          exit "$sdk_status"

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GMailGPU-0.1-Beta-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
